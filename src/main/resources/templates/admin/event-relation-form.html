<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><#if relation??>编辑<#else>添加</#if>事件-人物关联 - 名人名单管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background: #2c3e50;
        }
        .sidebar .nav-link {
            color: #adb5bd;
        }
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: #fff;
            background: #34495e;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <nav class="col-md-3 col-lg-2 sidebar p-3">
                <h4 class="text-white mb-4">管理系统</h4>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/dashboard">仪表盘</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/hero/list">正面人物管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/villain/list">反面人物管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/event/period/list">时期管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/event/list">历史事件管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/admin/event/relation/list">事件-人物关联</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/user/list">管理员管理</a>
                    </li>
                    <li class="nav-item mt-5">
                        <a class="nav-link text-danger" href="javascript:void(0)" onclick="logout()">退出登录</a>
                    </li>
                </ul>
            </nav>
            <!-- 主要内容 -->
            <main class="col-md-9 col-lg-10 p-4" style="background: #f8f9fa;">
                <nav aria-label="breadcrumb" class="mb-3">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/admin/dashboard">首页</a></li>
                        <li class="breadcrumb-item"><a href="/admin/event/relation/list">事件-人物关联</a></li>
                        <li class="breadcrumb-item active"><#if relation??>编辑<#else>添加</#if>关联</li>
                    </ol>
                </nav>

                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><#if relation??>编辑<#else>添加</#if>事件-人物关联</h5>
                    </div>
                    <div class="card-body">
                        <form id="relationForm">
                            <#if relation??>
                            <input type="hidden" name="id" value="${relation.id}">
                            </#if>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">选择事件 <span class="text-danger">*</span></label>
                                    <select class="form-select" name="eventId" id="eventSelect" required>
                                        <option value="">请选择事件</option>
                                        <#if events??>
                                            <#list events as ev>
                                                <option value="${ev.id}" <#if relation?? && relation.eventId == ev.id>selected</#if>>${ev.name} (<#if ev.eventDate??>${ev.eventDate}<#else>无日期</#if>)</option>
                                            </#list>
                                        </#if>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">人物类型</label>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input person-type" type="radio" name="personType" value="HERO" id="typeHero" <#if !relation?? || (relation?? && relation.personType == 'HERO')>checked</#if>>
                                            <label class="form-check-label" for="typeHero">正面人物</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input person-type" type="radio" name="personType" value="VILLAIN" id="typeVillain" <#if relation?? && relation.personType == 'VILLAIN'>checked</#if>>
                                            <label class="form-check-label" for="typeVillain">反面人物</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">选择人物 <span class="form-text text-muted" id="personCountText">(0个可选)</span> <span class="text-danger">*</span></label>
                                    <select class="form-select" name="personId" id="personSelect" required>
                                        <option value="">请选择人物类型以查看可用人物</option>
                                    </select>
                                    <div class="form-text" id="personHint">选择人物类型后，这里会显示对应类型的人物列表</div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">角色描述</label>
                                <input type="text" class="form-control" name="roleDesc" value="${(relation.roleDesc)!''}" placeholder="如：总指挥、爆破手">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">贡献描述</label>
                                <textarea class="form-control" name="contribution" rows="3" placeholder="描述人物在事件中的贡献">${(relation.contribution)!''}</textarea>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">保存</button>
                                <a href="/admin/event/relation/list" class="btn btn-secondary">取消</a>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 英雄和反派数据 - 添加调试信息
        console.log('FreeMarker heroes变量是否存在:', '<#if heroes??>是<#else>否</#if>');
        console.log('FreeMarker villains变量是否存在:', '<#if villains??>是<#else>否</#if>');
        
        const heroes = [
            <#if heroes?? && heroes?size gt 0>
                <#list heroes as h>
                    {id: '${h.id!""}', name: '${h.name!""}', category: '${h.category!""}'}<#if h?has_next>,</#if>
                </#list>
            </#if>
        ];
        const villains = [
            <#if villains?? && villains?size gt 0>
                <#list villains as v>
                    {id: '${v.id!""}', name: '${v.name!""}', category: '${v.category!""}'}<#if v?has_next>,</#if>
                </#list>
            </#if>
        ];
        
        // 调试输出
        console.log('英雄数据:', heroes);
        console.log('反派数据:', villains);
        console.log('英雄数量:', heroes.length);
        console.log('英雄示例:', heroes.length > 0 ? heroes[0] : '无数据');
        console.log('反派数量:', villains.length);
        console.log('反派示例:', villains.length > 0 ? villains[0] : '无数据');
        
        // 安全获取人物名称函数
        function safeGetPersonName(person) {
            return person && person.name ? person.name.replace(/['"<>]/g, '') : '';
        }

        // 更新人物下拉框
        function updatePersonSelect() {
            const personTypeRadios = document.querySelectorAll('input[name="personType"]');
            let selectedPersonType = null;
            
            // 找到选中的radio
            for (let radio of personTypeRadios) {
                if (radio.checked) {
                    selectedPersonType = radio.value;
                    break;
                }
            }
            
            if (!selectedPersonType) {
                console.log('未选择人物类型，默认使用第一个');
                // 如果没有选中，默认选中第一个
                if (personTypeRadios.length > 0) {
                    selectedPersonType = personTypeRadios[0].value;
                    personTypeRadios[0].checked = true;
                } else {
                    console.log('没有找到人物类型单选按钮');
                    return;
                }
            }
            
            const personSelect = document.getElementById('personSelect');
            const personCountText = document.getElementById('personCountText');
            const personHint = document.getElementById('personHint');
            const currentPersonId = '${(relation.personId)!""}';
            
            console.log('当前人物类型:', selectedPersonType);
            console.log('当前人物ID:', currentPersonId);
            console.log('英雄数组:', heroes);
            console.log('反派数组:', villains);
            console.log('英雄数量:', Array.isArray(heroes) ? heroes.length : '不是数组');
            console.log('反派数量:', Array.isArray(villains) ? villains.length : '不是数组');

            let persons = null;
            if (selectedPersonType === 'HERO') {
                persons = Array.isArray(heroes) ? heroes : [];
            } else {
                persons = Array.isArray(villains) ? villains : [];
            }
            
            console.log('当前人物列表:', persons);
            console.log('当前人物列表长度:', persons.length);

            // 更新统计文本
            const typeName = selectedPersonType === 'HERO' ? '正面人物' : '反面人物';
            personCountText.textContent = `(${persons.length}个${typeName})`;
            
            // 清空并重新填充下拉框
            personSelect.innerHTML = '<option value="">请选择人物</option>';
            
            if (!persons || persons.length === 0) {
                console.log('人物列表为空或不存在');
                personSelect.innerHTML += '<option value="">暂无可用人物</option>';
                personHint.textContent = `没有找到可用的${typeName}，请先在人物管理中添加${typeName}`;
                return;
            }
            
            // 更新提示文本
            personHint.textContent = `已加载${persons.length}个${typeName}，请选择`;
            
            let foundSelected = false;
            persons.forEach(p => {
                if (!p || !p.id) {
                    console.log('跳过无效人物数据:', p);
                    return;
                }
                const selected = (p.id && currentPersonId && p.id.toString() === currentPersonId.toString()) ? 'selected' : '';
                if (selected) {
                    foundSelected = true;
                }
                const safeName = p.name ? safeGetPersonName(p) : '未知人物';
                console.log(`检查人物: ${p.id} = ${safeName}, 是否选中: ${selected}`);
                personSelect.innerHTML += `<option value="${p.id}" ${selected}>${safeName}</option>`;
            });
            
            // 如果当前人物ID存在但在下拉框中没有选中，尝试手动设置
            if (currentPersonId && !foundSelected) {
                console.log('尝试手动设置选中项:', currentPersonId);
                for (let i = 0; i < personSelect.options.length; i++) {
                    if (personSelect.options[i].value === currentPersonId) {
                        personSelect.selectedIndex = i;
                        console.log('已手动选中');
                        break;
                    }
                }
            }
            
            // 启用下拉框
            personSelect.disabled = false;
            console.log('人物下拉框已启用，选项数量:', personSelect.options.length);
        }

        // 监听人物类型变化
        document.querySelectorAll('.person-type').forEach(radio => {
            radio.addEventListener('change', updatePersonSelect);
        });

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM已加载，开始初始化...');
            
            // 调试：检查事件下拉框是否有数据
            const eventSelect = document.getElementById('eventSelect');
            console.log('事件下拉框选项数量:', eventSelect ? eventSelect.options.length : '元素不存在');
            console.log('事件下拉框当前值:', eventSelect ? eventSelect.value : 'N/A');
            
            const currentPersonType = '${(relation.personType)!""}';
            console.log('当前人物类型(从后端获取):', currentPersonType);
            
            // 检查人物类型单选按钮
            const personTypeRadios = document.querySelectorAll('.person-type');
            console.log('人物类型单选按钮数量:', personTypeRadios.length);
            
            // 如果是编辑模式，先设置人物类型
            if (currentPersonType) {
                console.log('编辑模式，设置人物类型:', currentPersonType);
                const typeRadio = document.querySelector(`input[name="personType"][value="${currentPersonType}"]`);
                if (typeRadio) {
                    typeRadio.checked = true;
                    console.log('人物类型已设置');
                }
            } else {
                // 添加模式，确保至少有一个被选中
                console.log('添加模式，确保默认选中正面人物');
                const heroRadio = document.getElementById('typeHero');
                if (heroRadio) {
                    heroRadio.checked = true;
                    console.log('默认选中正面人物');
                }
            }
            
            // 更新人物下拉框
            console.log('执行updatePersonSelect...');
            updatePersonSelect();
            
            // 添加调试：检查是否所有元素都存在
            console.log('事件下拉框元素:', eventSelect);
            console.log('人物下拉框元素:', document.getElementById('personSelect'));
            console.log('人物类型单选按钮:', personTypeRadios.length);
        });

        // 表单提交
        document.getElementById('relationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const params = new URLSearchParams(formData);

            fetch('/admin/event/relation/save', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: params
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    alert('保存成功');
                    window.location.href = '/admin/event/relation/list';
                } else {
                    alert(data.message);
                }
            });
        });

        function logout() {
            fetch('/api/auth/logout', { method: 'POST' })
                .then(() => window.location.href = '/admin/login');
        }
    </script>
</body>
</html>
