<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${(relation??)?then('编辑','添加')}事件-人物关联 - 名人名单管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background: #2c3e50;
        }
        .sidebar .nav-link {
            color: #adb5bd;
        }
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: #fff;
            background: #34495e;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <nav class="col-md-3 col-lg-2 sidebar p-3">
                <h4 class="text-white mb-4">管理系统</h4>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/dashboard">仪表盘</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/hero/list">正面人物管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/villain/list">反面人物管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/event/period/list">时期管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/event/list">历史事件管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/admin/event/relation/list">事件-人物关联</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/user/list">管理员管理</a>
                    </li>
                    <li class="nav-item mt-5">
                        <a class="nav-link text-danger" href="javascript:void(0)" onclick="logout()">退出登录</a>
                    </li>
                </ul>
            </nav>
            <!-- 主要内容 -->
            <main class="col-md-9 col-lg-10 p-4" style="background: #f8f9fa;">
                <nav aria-label="breadcrumb" class="mb-3">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/admin/dashboard">首页</a></li>
                        <li class="breadcrumb-item"><a href="/admin/event/relation/list">事件-人物关联</a></li>
                        <li class="breadcrumb-item active">${(relation??)?then('编辑','添加')}关联</li>
                    </ol>
                </nav>

                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">${(relation??)?then('编辑','添加')}事件-人物关联</h5>
                    </div>
                    <div class="card-body">
                        <form id="relationForm">
                            <#if relation??>
                            <input type="hidden" name="id" value="${relation.id}">
                            </#if>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">选择事件 <span class="text-danger">*</span></label>
                                    <select class="form-select" name="eventId" id="eventSelect" required>
                                        <option value="">请选择事件</option>
                                        <#if events??>
                                            <#list events as ev>
                                                <option value="${ev.id}" ${((relation.eventId)?? && relation.eventId == ev.id)?then('selected','')}>${ev.name} (${(ev.eventDate)?string('yyyy-MM-dd')})</option>
                                            </#list>
                                        </#if>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">人物类型</label>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input person-type" type="radio" name="personType" value="HERO" id="typeHero" checked>
                                            <label class="form-check-label" for="typeHero">正面人物</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input person-type" type="radio" name="personType" value="VILLAIN" id="typeVillain">
                                            <label class="form-check-label" for="typeVillain">反面人物</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">选择人物 <span class="text-danger">*</span></label>
                                    <select class="form-select" name="personId" id="personSelect" required>
                                        <option value="">请先选择事件和人物类型</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">角色描述</label>
                                <input type="text" class="form-control" name="roleDesc" value="${(relation.roleDesc)!''}" placeholder="如：总指挥、爆破手">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">贡献描述</label>
                                <textarea class="form-control" name="contribution" rows="3" placeholder="描述人物在事件中的贡献">${(relation.contribution)!''}</textarea>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">保存</button>
                                <a href="/admin/event/relation/list" class="btn btn-secondary">取消</a>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 英雄和反派数据
        const heroes = [
            <#if heroes??>
                <#list heroes as h>
                    {id: '${h.id}', name: '${h.name}', category: '${h.category}'}<#if h?has_next>,</#if>
                </#list>
            </#if>
        ];
        const villains = [
            <#if villains??>
                <#list villains as v>
                    {id: '${v.id}', name: '${v.name}', category: '${v.category}'}<#if v?has_next>,</#if>
                </#list>
            </#if>
        ];

        // 更新人物下拉框
        function updatePersonSelect() {
            const personType = document.querySelector('input[name="personType"]:checked').value;
            const personSelect = document.getElementById('personSelect');
            const currentPersonId = '${(relation.personId)!""}';

            let persons = personType === 'HERO' ? heroes : villains;

            personSelect.innerHTML = '<option value="">请选择人物</option>';
            persons.forEach(p => {
                const selected = p.id === currentPersonId ? 'selected' : '';
                personSelect.innerHTML += `<option value="${p.id}" ${selected}>${p.name}</option>`;
            });
        }

        // 监听人物类型变化
        document.querySelectorAll('.person-type').forEach(radio => {
            radio.addEventListener('change', updatePersonSelect);
        });

        // 初始化
        updatePersonSelect();

        // 如果是编辑模式，设置初始类型
        const currentPersonType = '${(relation.personType)!""}';
        if (currentPersonType) {
            document.querySelector(`input[name="personType"][value="${currentPersonType}"]`).checked = true;
            updatePersonSelect();
        }

        // 表单提交
        document.getElementById('relationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const params = new URLSearchParams(formData);

            fetch('/admin/event/relation/save', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: params
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    alert('保存成功');
                    window.location.href = '/admin/event/relation/list';
                } else {
                    alert(data.message);
                }
            });
        });

        function logout() {
            fetch('/api/auth/logout', { method: 'POST' })
                .then(() => window.location.href = '/admin/login');
        }
    </script>
</body>
</html>
