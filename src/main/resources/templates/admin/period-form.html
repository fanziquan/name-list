<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><#if period??>编辑<#else>添加</#if>时期 - 名人名单管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background: #2c3e50;
        }
        .sidebar .nav-link {
            color: #adb5bd;
        }
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: #fff;
            background: #34495e;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <nav class="col-md-3 col-lg-2 sidebar p-3">
                <h4 class="text-white mb-4">管理系统</h4>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/dashboard">仪表盘</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/hero/list">正面人物管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/villain/list">反面人物管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/admin/event/period/list">时期管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/event/list">历史事件管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/event/relation/list">事件-人物关联</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/user/list">管理员管理</a>
                    </li>
                    <li class="nav-item mt-5">
                        <a class="nav-link text-danger" href="javascript:void(0)" onclick="logout()">退出登录</a>
                    </li>
                </ul>
            </nav>
            <!-- 主要内容 -->
            <main class="col-md-9 col-lg-10 p-4" style="background: #f8f9fa;">
                <nav aria-label="breadcrumb" class="mb-3">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/admin/dashboard">首页</a></li>
                        <li class="breadcrumb-item"><a href="/admin/event/period/list">时期管理</a></li>
                        <li class="breadcrumb-item active"><#if period??>编辑<#else>添加</#if>时期</li>
                    </ol>
                </nav>

                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><#if period??>编辑<#else>添加</#if>时期</h5>
                    </div>
                    <div class="card-body">
                        <form id="periodForm">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">时期编码 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="code" value="${(period.code)!''}" <#if period??>readonly<#else>required</#if>>
                                    <div class="form-text">如：MODERN、CONTEM（系统使用，不允许修改）</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">时期名称 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="name" value="${(period.name)!''}" required>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <label class="form-label">开始年份 <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" name="startYear" value="${(period.startYear)!''}" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">结束年份 <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" name="endYear" value="${(period.endYear)!''}" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">排序号</label>
                                    <input type="number" class="form-control" name="orderNum" value="${(period.orderNum)!1}">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">时期简介</label>
                                <textarea class="form-control" name="description" rows="3">${(period.description)!''}</textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">状态</label>
                                <select class="form-select" name="status">
                                    <option value="1" <#if period?? && period.status == 1>selected</#if>>启用</option>
                                    <option value="0" <#if period?? && period.status == 0>selected</#if>>禁用</option>
                                </select>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">保存</button>
                                <a href="/admin/event/period/list" class="btn btn-secondary">取消</a>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('periodForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const params = new URLSearchParams(formData);

            fetch('/admin/event/period/save', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: params
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    alert('保存成功');
                    window.location.href = '/admin/event/period/list';
                } else {
                    alert(data.message);
                }
            });
        });

        function logout() {
            fetch('/api/auth/logout', { method: 'POST' })
                .then(() => window.location.href = '/admin/login');
        }
    </script>
</body>
</html>
