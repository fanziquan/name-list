<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><#if event??>编辑<#else>添加</#if>历史事件 - 名人名单管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background: #2c3e50;
        }
        .sidebar .nav-link {
            color: #adb5bd;
        }
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: #fff;
            background: #34495e;
        }
        #photoPreview {
            max-width: 300px;
            max-height: 200px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <nav class="col-md-3 col-lg-2 sidebar p-3">
                <h4 class="text-white mb-4">管理系统</h4>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/dashboard">仪表盘</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/hero/list">正面人物管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/villain/list">反面人物管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/event/period/list">时期管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/admin/event/list">历史事件管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/event/relation/list">事件-人物关联</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/user/list">管理员管理</a>
                    </li>
                    <li class="nav-item mt-5">
                        <a class="nav-link text-danger" href="javascript:void(0)" onclick="logout()">退出登录</a>
                    </li>
                </ul>
            </nav>
            <!-- 主要内容 -->
            <main class="col-md-9 col-lg-10 p-4" style="background: #f8f9fa;">
                <nav aria-label="breadcrumb" class="mb-3">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/admin/dashboard">首页</a></li>
                        <li class="breadcrumb-item"><a href="/admin/event/list">历史事件管理</a></li>
                        <li class="breadcrumb-item active"><#if event??>编辑<#else>添加</#if>事件</li>
                    </ol>
                </nav>

                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><#if event??>编辑<#else>添加</#if>历史事件</h5>
                    </div>
                    <div class="card-body">
                        <form id="eventForm">
                            <#if event??>
                            <input type="hidden" name="id" value="${event.id}">
                            </#if>

                            <h6 class="border-bottom pb-2 mb-3">基本信息</h6>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">事件名称 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="name" value="${(event.name)!''}" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">事件日期 <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" name="eventDate" value="${(event.eventDate)!''}" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">所属时期 <span class="text-danger">*</span></label>
                                    <select class="form-select" name="periodCode" required>
                                        <option value="">请选择</option>
                                        <#if periods??>
                                            <#list periods as p>
                                                <option value="${p.code}" <#if event?? && event.periodCode == p.code>selected</#if>>${p.name}</option>
                                            </#list>
                                        </#if>
                                    </select>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">事件地点</label>
                                    <input type="text" class="form-control" name="location" value="${(event.location)!''}">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">重要程度</label>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="significance" value="MAJOR" id="major" <#if !event?? || event.significance == 'MAJOR'>checked</#if>>
                                            <label class="form-check-label" for="major">重大</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="significance" value="ORDINARY" id="ordinary" <#if event?? && event.significance == 'ORDINARY'>checked</#if>>
                                            <label class="form-check-label" for="ordinary">普通</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <h6 class="border-bottom pb-2 mb-3">事件描述</h6>
                            <div class="mb-3">
                                <label class="form-label">简要描述 <span class="text-danger">*</span></label>
                                <textarea class="form-control" name="briefDesc" rows="2" maxlength="500" required>${(event.briefDesc)!''}</textarea>
                                <div class="form-text">最多500字符</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">详细描述</label>
                                <textarea class="form-control" name="fullDesc" rows="5">${(event.fullDesc)!''}</textarea>
                            </div>

                            <h6 class="border-bottom pb-2 mb-3">事件配图</h6>
                            <div class="mb-3">
                                <label class="form-label">上传配图</label>
                                <input type="file" class="form-control" name="photo" accept="image/*" id="photoInput">
                                <div class="form-text">支持 JPG/PNG，最大 5MB</div>
                                <#if event?? && event.photoUrl??>
                                <div class="mt-2">
                                    <p>当前图片：</p>
                                    <img src="${event.photoUrl}" alt="事件配图" id="photoPreview" class="img-thumbnail">
                                </div>
                                </#if>
                                <div id="newPhotoPreview" class="mt-2" style="display:none;">
                                    <p>新图片预览：</p>
                                    <img src="" alt="新配图预览" id="newPhotoImg" class="img-thumbnail" style="max-width:300px;">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">状态</label>
                                <select class="form-select" name="status">
                                    <option value="1" <#if !event?? || event.status == 1>selected</#if>>显示</option>
                                    <option value="0" <#if event?? && event.status == 0>selected</#if>>隐藏</option>
                                </select>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">保存</button>
                                <a href="/admin/event/list" class="btn btn-secondary">取消</a>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 图片预览
        document.getElementById('photoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('newPhotoImg').src = e.target.result;
                    document.getElementById('newPhotoPreview').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // 表单提交
        document.getElementById('eventForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const form = this;
            const formData = new FormData(form);

            fetch('/admin/event/save', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    alert('保存成功');
                    window.location.href = '/admin/event/list';
                } else {
                    alert(data.message);
                }
            });
        });

        function logout() {
            fetch('/api/auth/logout', { method: 'POST' })
                .then(() => window.location.href = '/admin/login');
        }
    </script>
</body>
</html>
