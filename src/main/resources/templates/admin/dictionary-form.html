<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><#if dictionary??>编辑<#else>添加</#if>字典项 - 名人名单管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <#include "/common/sidebar.html">
            <!-- 主要内容 -->
            <main class="col-md-9 col-lg-10 p-4" style="background: #f8f9fa;">
                <nav aria-label="breadcrumb" class="mb-3">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/admin/dashboard">首页</a></li>
                        <li class="breadcrumb-item"><a href="/admin/dictionary/list">数据字典</a></li>
                        <li class="breadcrumb-item active"><#if dictionary??>编辑<#else>添加</#if>字典项</li>
                    </ol>
                </nav>

                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><#if dictionary??>编辑<#else>添加</#if>字典项</h5>
                    </div>
                    <div class="card-body">
                        <form id="dictForm">
                            <#if dictionary??>
                            <input type="hidden" name="id" value="${dictionary.id}">
                            </#if>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">字典编码 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="dictCode" value="${(dictionary.dictCode)!''}" required
                                           placeholder="如: HERO_CATEGORY, VILLAIN_CATEGORY">
                                    <div class="form-text">字典的唯一标识，建议使用大写字母和下划线</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">字典名称 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="dictName" value="${(dictionary.dictName)!''}" required
                                           placeholder="如: 正面人物分类">
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">字典项编码 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="dictItem" value="${(dictionary.dictItem)!''}" required
                                           placeholder="如: WARRIOR, SCHOLAR">
                                    <div class="form-text">字典项的唯一值，建议使用大写字母和下划线</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">字典项名称 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="itemName" value="${(dictionary.itemName)!''}" required
                                           placeholder="如: 勇士">
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">标识 <span class="text-danger">*</span></label>
                                    <select class="form-select" name="mark" required>
                                        <option value="">请选择</option>
                                        <option value="HERO" <#if dictionary?? && dictionary.mark == 'HERO'>selected</#if>>正面人物</option>
                                        <option value="VILLAIN" <#if dictionary?? && dictionary.mark == 'VILLAIN'>selected</#if>>反面人物</option>
                                        <option value="EVENT" <#if dictionary?? && dictionary.mark == 'EVENT'>selected</#if>>历史事件</option>
                                        <option value="PERIOD" <#if dictionary?? && dictionary.mark == 'PERIOD'>selected</#if>>历史时期</option>
                                        <option value="COMMON" <#if dictionary?? && dictionary.mark == 'COMMON'>selected</#if>>通用</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">状态</label>
                                    <select class="form-select" name="status">
                                        <option value="1" <#if !dictionary?? || (dictionary?? && dictionary.status == '1')>selected</#if>>启用</option>
                                        <option value="0" <#if dictionary?? && dictionary.status == '0'>selected</#if>>禁用</option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-primary">保存</button>
                                <a href="/admin/dictionary/list" class="btn btn-secondary">取消</a>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('dictForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const params = new URLSearchParams(formData);

            fetch('/admin/dictionary/save', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: params
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    alert('保存成功');
                    window.location.href = '/admin/dictionary/list';
                } else {
                    alert(data.message);
                }
            });
        });
    </script>
</body>
</html>
